; ── Cafeana Kitchen Terminal — PlatformIO Configuration ──────────────────────
;
; Two build environments:
;   - esp32dev        : Normal build (live Firebase mode)
;   - esp32dev_mock   : MOCK_MODE build (no Firebase, pure hardware demo)
;
; Flash with:
;   pio run -e esp32dev -t upload          (live)
;   pio run -e esp32dev_mock -t upload     (mock/demo)

[common]
platform  = espressif32
board     = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed  = 921600

lib_deps =
    ; OLED display driver
    adafruit/Adafruit SSD1306 @ ^2.5.10
    adafruit/Adafruit GFX Library @ ^1.11.9

    ; JSON parsing (used in live mode for Firestore responses)
    bblanchon/ArduinoJson @ ^7.3.1

    ; ── NOT needed: Firebase-ESP-Client is NOT used ────────────────────────
    ; We call the Firestore REST API directly via HTTPClient (as per
    ; api-contract.md) which avoids the Firebase-ESP-Client library's
    ; size overhead. The raw WiFiClientSecure + HTTPClient approach is
    ; sufficient and fully compatible with Wokwi simulation.

build_flags =
    -DCORE_DEBUG_LEVEL=3   ; Enable info/debug serial output

; ── Live mode (real Firebase) ──────────────────────────────────────────────────
[env:esp32dev]
extends     = common
build_flags =
    ${common.build_flags}
    -DUSE_SECRETS_H
    ; This includes the local secrets.h file for Firebase credentials.
    ; Without secrets.h, fill FIREBASE_API_KEY etc. in main.cpp directly.

; ── Mock mode (Wokwi standalone / no internet required) ───────────────────────
[env:esp32dev_mock]
extends     = common
build_flags =
    ${common.build_flags}
    -DMOCK_MODE
