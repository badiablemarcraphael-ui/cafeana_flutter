name: cafeana_app
description: "Cafeana – café management mobile and web application."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── State management ────────────────────────────────────────────────────────
  flutter_riverpod: ^2.6.1
  hooks_riverpod: ^2.6.1
  flutter_hooks: ^0.21.0
  riverpod_annotation: ^2.6.1

  # ── Navigation ───────────────────────────────────────────────────────────────
  go_router: ^14.8.1

  # ── Firebase ─────────────────────────────────────────────────────────────────
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.7

  # ── Utilities ────────────────────────────────────────────────────────────────
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  fl_chart: ^1.2.0
  file_saver: ^0.4.0
  google_fonts: ^8.2.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  fluttertoast: ^10.0.0
  url_launcher: ^6.3.1
  geolocator: ^13.0.4

  flutter_web_plugins:
    sdk: flutter
  google_sign_in: ^7.2.0
  flutter_local_notifications: ^22.3.2
  firebase_messaging: ^15.2.10
dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation for Riverpod
  riverpod_generator: ^2.6.2
  build_runner: ^2.4.13

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/drinks/   # Place drink/product images here
    - assets/images/          # Other general images (logo, backgrounds, etc.)

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/logo.png"

